name: score-workloads

on:
  pull_request:
    paths:
      - 'platform/apps/*.yaml'
      - 'platform/crd/platformcluster-rgd.yaml'
      - 'platform/workloads/**'
      - 'platform/scripts/*.sh'
      - '.github/workflows/score-workloads.yaml'
  push:
    paths:
      - 'platform/apps/*.yaml'
      - 'platform/crd/platformcluster-rgd.yaml'
      - 'platform/workloads/**'
      - 'platform/scripts/*.sh'
      - '.github/workflows/score-workloads.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install score-k8s
        run: go install -v github.com/score-spec/score-k8s/cmd/score-k8s@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate Score workloads
        run: bash platform/scripts/check-score-app.sh
