apiVersion: api.platform.example.com/v1
kind: PlatformCluster
metadata:
  name: demo-cluster-switcharoo
  namespace: default
  labels:
    environment: dev
    team: demo-app-team
    purpose: development
spec:
  clusterSpec:
    clusterName: demo-cluster-switcharoo
    region: us-east
    kubernetesVersion: "1.35"
    nodePool:
      count: 3
      type: g6-standard-4
    labels:
      environment: dev
      team: platform-team
  components:
    gatewayFabric:
      enabled: true
    userApps:
      enabled:
        - demo-app-switcharoo
    o11yStack:
      enabled: false
      loki: true
      tempo: true
      grafana: true
      alloy: true
    harbor:
      enabled: false
    headlamp:
      enabled: true
