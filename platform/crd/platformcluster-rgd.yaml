apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: platformcluster
spec:
  schema:
    group: api.platform.example.com
    apiVersion: v1
    kind: PlatformCluster
    spec:
      clusterSpec:
        clusterName: string | required=true
        region: string | default="us-ord"
        kubernetesVersion: string | default="1.35"
        # Deprecated no-op field kept only to avoid breaking the published CRD schema.
        controlPlaneAcl:
          enabled: boolean | default=false
          addresses:
            ipv4: "[]string"
            ipv6: "[]string"
        nodePool:
          count: integer | default=3
          type: string | default="g6-standard-6"
        labels:
          environment: string | default="dev"
          team: string | required=true
      components:
        userApps:
          enabled: '[]string | uniqueItems=true'
        o11yStack:
          enabled: boolean | default=false
          loki: boolean | default=true
          tempo: boolean | default=true
          grafana: boolean | default=true
          alloy: boolean | default=true
        harbor:
          enabled: boolean | default=false
        headlamp:
          enabled: boolean | default=false
    status:
      clusterStatus: ${lkeCluster.status.atProvider.status}
      clusterEndpoint: ${lkeCluster.status.atProvider.apiEndpoints[0]}
  resources:
    - id: lkeCluster
      template:
        apiVersion: lke.linode.upbound.io/v1alpha1
        kind: Cluster
        metadata:
          name: ${schema.spec.clusterSpec.clusterName}
          labels:
            environment: ${schema.spec.clusterSpec.labels.environment}
            team: ${schema.spec.clusterSpec.labels.team}
            managed-by: kro-platformcluster
            platform-cluster-name: ${schema.spec.clusterSpec.clusterName}
        spec:
          forProvider:
            label: ${schema.spec.clusterSpec.clusterName}
            region: ${schema.spec.clusterSpec.region}
            k8sVersion: ${schema.spec.clusterSpec.kubernetesVersion}
            tags:
              - "environment:${schema.spec.clusterSpec.labels.environment}"
              - "team:${schema.spec.clusterSpec.labels.team}"
              - "managed-by:kro"
            pool:
              - type: ${schema.spec.clusterSpec.nodePool.type}
                count: ${double(schema.spec.clusterSpec.nodePool.count)}
          writeConnectionSecretToRef:
            name: "${schema.spec.clusterSpec.clusterName}-kubeconfig"
            namespace: argocd
          providerConfigRef:
            name: default
      readyWhen:
        - ${lkeCluster.status.atProvider.status == "ready"}

    # - id: nodePool
    #   template:
    #     apiVersion: lke.linode.upbound.io/v1alpha1
    #     kind: NodePool
    #     metadata:
    #       name: "${schema.spec.clusterSpec.clusterName}-pool"
    #       labels:
    #         environment: ${schema.spec.clusterSpec.labels.environment}
    #         team: ${schema.spec.clusterSpec.labels.team}
    #         managed-by: kro-platformcluster
    #         platform-cluster-name: ${schema.spec.clusterSpec.clusterName}
    #     spec:
    #       forProvider:
    #         clusterIdSelector:
    #           matchLabels:
    #             managed-by: kro-platformcluster
    #             platform-cluster-name: ${schema.spec.clusterSpec.clusterName}
    #         nodeCount: ${double(schema.spec.clusterSpec.nodePool.count)}
    #         type: ${schema.spec.clusterSpec.nodePool.type}
    #       providerConfigRef:
    #         name: default

    - id: bootstrapSA
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
          namespace: argocd

    - id: bootstrapRole
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
          namespace: argocd
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "update", "patch"]

    - id: bootstrapRoleBinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
          namespace: argocd
        subjects:
          - kind: ServiceAccount
            name: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
            namespace: argocd
        roleRef:
          kind: Role
          name: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
          apiGroup: rbac.authorization.k8s.io

    - id: publishRole
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-platformcluster-publish"
          namespace: ${schema.metadata.namespace}
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "update", "patch"]

    - id: publishRoleBinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-platformcluster-publish"
          namespace: ${schema.metadata.namespace}
        subjects:
          - kind: ServiceAccount
            name: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
            namespace: argocd
        roleRef:
          kind: Role
          name: "${schema.spec.clusterSpec.clusterName}-platformcluster-publish"
          apiGroup: rbac.authorization.k8s.io

    - id: argocdRegisterJob
      readyWhen:
        - ${argocdRegisterJob.status.succeeded == 1}
      template:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-argocd-register"
          namespace: argocd
          labels:
            platform-cluster: ${schema.metadata.name}
        spec:
          backoffLimit: 5
          activeDeadlineSeconds: 3600
          template:
            spec:
              serviceAccountName: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
              restartPolicy: OnFailure
              containers:
                - name: register
                  image: bitnami/kubectl:latest
                  env:
                    - name: CLUSTER_NAME
                      value: "${schema.spec.clusterSpec.clusterName}"
                    - name: PLATFORM_CLUSTER_NAME
                      value: "${schema.metadata.name}"
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -euo pipefail
                      SECRET_NAME="$CLUSTER_NAME-kubeconfig"
                      RETRY_INTERVAL=15
                      MAX_ATTEMPTS=80

                      wait_for_secret() {
                        local secret_name="$1"
                        local secret_namespace="$2"
                        local attempt=1
                        until kubectl get secret "$secret_name" -n "$secret_namespace" > /dev/null 2>&1; do
                          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                            echo "Timed out waiting for secret $secret_namespace/$secret_name" >&2
                            exit 1
                          fi
                          echo "  secret $secret_namespace/$secret_name not found yet, retrying in $RETRY_INTERVALs..." >&2
                          sleep "$RETRY_INTERVAL"
                          attempt=$((attempt + 1))
                        done
                      }

                      get_kubeconfig_b64() {
                        local secret_name="$1"
                        kubectl get secret "$secret_name" -n argocd -o go-template='{{index .data "kubeconfig"}}' 2> /dev/null || true
                      }

                      wait_for_kubeconfig_data() {
                        local secret_name="$1"
                        local attempt=1
                        local kubeconfig_b64=""
                        while [ -z "$kubeconfig_b64" ]; do
                          kubeconfig_b64=$(get_kubeconfig_b64 "$secret_name")
                          if [ -z "$kubeconfig_b64" ]; then
                            kubeconfig_b64=$(kubectl get secret "$secret_name" -n argocd \
                              -o go-template='{{index .data "attribute.kubeconfig"}}' 2> /dev/null || true)
                          fi
                          if [ -n "$kubeconfig_b64" ]; then
                            printf '%s' "$kubeconfig_b64"
                            return 0
                          fi
                          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                            echo "Timed out waiting for kubeconfig data in secret argocd/$secret_name" >&2
                            kubectl get secret "$secret_name" -n argocd -o go-template='{{range $k, $_ := .data}}{{printf "%s\n" $k}}{{end}}' >&2
                            exit 1
                          fi
                          echo "  kubeconfig data missing from secret argocd/$secret_name, retrying in $RETRY_INTERVALs..." >&2
                          sleep "$RETRY_INTERVAL"
                          attempt=$((attempt + 1))
                        done
                      }

                      echo "Waiting for kubeconfig secret: $SECRET_NAME"
                      wait_for_secret "$SECRET_NAME" argocd
                      echo "Kubeconfig secret found, extracting credentials..."

                      # Upjet connection secrets commonly expose provider attributes
                      # under attribute.<name> instead of the bare key.
                      KUBECONFIG_B64=$(wait_for_kubeconfig_data "$SECRET_NAME")

                      printf '%s' "$KUBECONFIG_B64" | base64 -d > /tmp/lke-kubeconfig

                      SERVER=$(KUBECONFIG=/tmp/lke-kubeconfig kubectl config view --raw \
                        -o jsonpath='{.clusters[0].cluster.server}')
                      CA_DATA=$(KUBECONFIG=/tmp/lke-kubeconfig kubectl config view --raw \
                        -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')

                      TOKEN=$(KUBECONFIG=/tmp/lke-kubeconfig kubectl config view --raw \
                        -o jsonpath='{.users[0].user.token}')
                      CERT_DATA=$(KUBECONFIG=/tmp/lke-kubeconfig kubectl config view --raw \
                        -o jsonpath='{.users[0].user.client-certificate-data}')
                      KEY_DATA=$(KUBECONFIG=/tmp/lke-kubeconfig kubectl config view --raw \
                        -o jsonpath='{.users[0].user.client-key-data}')

                      if [ -z "$SERVER" ]; then
                        echo "cluster server missing from kubeconfig in secret $SECRET_NAME"
                        exit 1
                      fi

                      if [ -z "$TOKEN" ] && { [ -z "$CERT_DATA" ] || [ -z "$KEY_DATA" ]; }; then
                        echo "cluster auth data missing from kubeconfig in secret $SECRET_NAME"
                        exit 1
                      fi

                      if [ -n "$TOKEN" ]; then
                        CONFIG="{\"bearerToken\":\"$TOKEN\",\"tlsClientConfig\":{\"insecure\":false,\"caData\":\"$CA_DATA\"}}"
                      else
                        CONFIG="{\"tlsClientConfig\":{\"insecure\":false,\"caData\":\"$CA_DATA\",\"certData\":\"$CERT_DATA\",\"keyData\":\"$KEY_DATA\"}}"
                      fi

                      echo "Registering $CLUSTER_NAME with ArgoCD at: $SERVER"

                      kubectl apply -f - <<EOF
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: $CLUSTER_NAME
                        namespace: argocd
                        labels:
                          argocd.argoproj.io/secret-type: cluster
                          platform-cluster: $PLATFORM_CLUSTER_NAME
                      type: Opaque
                      stringData:
                        name: "$CLUSTER_NAME"
                        server: "$SERVER"
                        config: '$CONFIG'
                      EOF

                      echo "Cluster $CLUSTER_NAME registered with ArgoCD."
                      rm -f /tmp/lke-kubeconfig

    - id: userWorkloadsApp
      forEach:
        - appName: ${schema.spec.components.userApps.enabled}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-${appName}"
          namespace: argocd
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          labels:
            platform-cluster: ${schema.metadata.name}
            component: workloads
        spec:
          project: default
          source:
            repoURL: git@github.com:cmcgalliard/2026-oss-summit.git
            targetRevision: try-three
            path: "platform/workloads/apps/${appName}/rendered"
          destination:
            name: "${schema.spec.clusterSpec.clusterName}"
            namespace: ${appName}
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            retry:
              limit: 3
              backoff:
                duration: 5s
                factor: 2
                maxDuration: 3m

    - id: lokiApp
      includeWhen:
        - ${schema.spec.components.o11yStack.enabled}
        - ${schema.spec.components.o11yStack.loki}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-loki"
          namespace: argocd
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          labels:
            platform-cluster: ${schema.metadata.name}
            component: o11y-stack
        spec:
          project: default
          source:
            repoURL: https://grafana.github.io/helm-charts
            chart: loki
            targetRevision: "6.16.0"
            helm:
              releaseName: loki
          destination:
            server: "${lkeCluster.status.atProvider.apiEndpoints[0]}"
            namespace: monitoring
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true

    - id: tempoApp
      includeWhen:
        - ${schema.spec.components.o11yStack.enabled}
        - ${schema.spec.components.o11yStack.tempo}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-tempo"
          namespace: argocd
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          labels:
            platform-cluster: ${schema.metadata.name}
            component: o11y-stack
        spec:
          project: default
          source:
            repoURL: https://grafana.github.io/helm-charts
            chart: tempo
            targetRevision: "1.10.0"
            helm:
              releaseName: tempo
          destination:
            server: "${lkeCluster.status.atProvider.apiEndpoints[0]}"
            namespace: monitoring
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true

    - id: grafanaApp
      includeWhen:
        - ${schema.spec.components.o11yStack.enabled}
        - ${schema.spec.components.o11yStack.grafana}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-grafana"
          namespace: argocd
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          labels:
            platform-cluster: ${schema.metadata.name}
            component: o11y-stack
        spec:
          project: default
          source:
            repoURL: https://grafana.github.io/helm-charts
            chart: grafana
            targetRevision: "8.6.2"
            helm:
              releaseName: grafana
              values: |
                adminPassword: admin123
                datasources:
                  datasources.yaml:
                    apiVersion: 1
                    datasources:
                      - name: Loki
                        type: loki
                        url: http://loki:3100
                        access: proxy
                        isDefault: true
                      - name: Tempo
                        type: tempo
                        url: http://tempo:3100
                        access: proxy
          destination:
            server: "${lkeCluster.status.atProvider.apiEndpoints[0]}"
            namespace: monitoring
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true

    - id: alloyApp
      includeWhen:
        - ${schema.spec.components.o11yStack.enabled}
        - ${schema.spec.components.o11yStack.alloy}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-alloy"
          namespace: argocd
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          labels:
            platform-cluster: ${schema.metadata.name}
            component: o11y-stack
        spec:
          project: default
          source:
            repoURL: https://grafana.github.io/helm-charts
            chart: alloy
            targetRevision: "0.9.2"
            helm:
              releaseName: alloy
          destination:
            server: "${lkeCluster.status.atProvider.apiEndpoints[0]}"
            namespace: monitoring
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true

    - id: harborApp
      includeWhen:
        - ${schema.spec.components.harbor.enabled}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-harbor"
          namespace: argocd
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          labels:
            platform-cluster: ${schema.metadata.name}
            component: platform
        spec:
          project: default
          source:
            repoURL: https://helm.goharbor.io
            chart: harbor
            targetRevision: "1.15.0"
            helm:
              releaseName: harbor
              values: |
                harborAdminPassword: Harbor12345
          destination:
            server: "${lkeCluster.status.atProvider.apiEndpoints[0]}"
            namespace: harbor
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true

    - id: headlampApp
      includeWhen:
        - ${schema.spec.components.headlamp.enabled}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-headlamp"
          namespace: argocd
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
          finalizers:
            - resources-finalizer.argocd.argoproj.io
          labels:
            platform-cluster: ${schema.metadata.name}
            component: platform
        spec:
          project: default
          source:
            repoURL: https://kubernetes-sigs.github.io/headlamp/
            chart: headlamp
            targetRevision: "0.40.1"
            helm:
              releaseName: headlamp
              values: |
                config:
                  sessionTTL: null
                serviceAccount:
                  create: true
                  name: headlamp
                extraManifests:
                  - |
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: headlamp-token
                      annotations:
                        kubernetes.io/service-account.name: headlamp
                    type: kubernetes.io/service-account-token
                service:
                  type: LoadBalancer
          destination:
            server: "${lkeCluster.status.atProvider.apiEndpoints[0]}"
            namespace: headlamp
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true

    - id: headlampTokenJob
      includeWhen:
        - ${schema.spec.components.headlamp.enabled}
      readyWhen:
        - ${headlampTokenJob.status.succeeded == 1}
      template:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: "${schema.spec.clusterSpec.clusterName}-headlamp-token"
          namespace: argocd
          labels:
            platform-cluster: ${schema.metadata.name}
          annotations:
            platform-cluster/bootstrap-job: "${string(argocdRegisterJob.status.succeeded)}"
        spec:
          backoffLimit: 5
          activeDeadlineSeconds: 3600
          template:
            spec:
              serviceAccountName: "${schema.spec.clusterSpec.clusterName}-argocd-bootstrap"
              restartPolicy: OnFailure
              containers:
                - name: publish-token
                  image: bitnami/kubectl:latest
                  env:
                    - name: CLUSTER_NAME
                      value: "${schema.spec.clusterSpec.clusterName}"
                    - name: PLATFORM_CLUSTER_NAME
                      value: "${schema.metadata.name}"
                    - name: PLATFORM_CLUSTER_NAMESPACE
                      value: "${schema.metadata.namespace}"
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -euo pipefail
                      SOURCE_SECRET_NAME="$CLUSTER_NAME-kubeconfig"
                      PUBLISHED_SECRET_NAME="$CLUSTER_NAME-headlamp-token"
                      HEADLAMP_NAMESPACE=headlamp
                      HEADLAMP_SERVICE_ACCOUNT=headlamp
                      HEADLAMP_TOKEN_SECRET=headlamp-token
                      RETRY_INTERVAL=15
                      MAX_ATTEMPTS=80

                      wait_for_secret() {
                        local secret_name="$1"
                        local secret_namespace="$2"
                        local attempt=1
                        until kubectl get secret "$secret_name" -n "$secret_namespace" > /dev/null 2>&1; do
                          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                            echo "Timed out waiting for secret $secret_namespace/$secret_name" >&2
                            exit 1
                          fi
                          echo "  secret $secret_namespace/$secret_name not found yet, retrying in $RETRY_INTERVALs..." >&2
                          sleep "$RETRY_INTERVAL"
                          attempt=$((attempt + 1))
                        done
                      }

                      wait_for_kubeconfig_data() {
                        local secret_name="$1"
                        local attempt=1
                        local kubeconfig_b64=""
                        while [ -z "$kubeconfig_b64" ]; do
                          kubeconfig_b64=$(kubectl get secret "$secret_name" -n argocd \
                            -o go-template='{{index .data "kubeconfig"}}' 2> /dev/null || true)
                          if [ -z "$kubeconfig_b64" ]; then
                            kubeconfig_b64=$(kubectl get secret "$secret_name" -n argocd \
                              -o go-template='{{index .data "attribute.kubeconfig"}}' 2> /dev/null || true)
                          fi
                          if [ -n "$kubeconfig_b64" ]; then
                            printf '%s' "$kubeconfig_b64"
                            return 0
                          fi
                          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                            echo "Timed out waiting for kubeconfig data in secret argocd/$secret_name" >&2
                            exit 1
                          fi
                          echo "  kubeconfig data missing from secret argocd/$secret_name, retrying in $RETRY_INTERVALs..." >&2
                          sleep "$RETRY_INTERVAL"
                          attempt=$((attempt + 1))
                        done
                      }

                      wait_for_cluster_api() {
                        local attempt=1
                        until KUBECONFIG=/tmp/lke-kubeconfig kubectl --request-timeout=10s get --raw=/readyz > /dev/null 2>&1; do
                          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                            echo "Timed out waiting for child cluster API to become ready" >&2
                            exit 1
                          fi
                          echo "  child cluster API not ready yet, retrying in $RETRY_INTERVALs..." >&2
                          sleep "$RETRY_INTERVAL"
                          attempt=$((attempt + 1))
                        done
                      }

                      wait_for_service_account() {
                        local service_account_name="$1"
                        local service_account_namespace="$2"
                        local attempt=1
                        until KUBECONFIG=/tmp/lke-kubeconfig kubectl get serviceaccount "$service_account_name" -n "$service_account_namespace" > /dev/null 2>&1; do
                          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                            echo "Timed out waiting for service account $service_account_namespace/$service_account_name" >&2
                            exit 1
                          fi
                          echo "  service account $service_account_namespace/$service_account_name not found yet, retrying in $RETRY_INTERVALs..." >&2
                          sleep "$RETRY_INTERVAL"
                          attempt=$((attempt + 1))
                        done
                      }

                      wait_for_token() {
                        local secret_name="$1"
                        local secret_namespace="$2"
                        local attempt=1
                        local token_b64=""
                        while [ -z "$token_b64" ]; do
                          token_b64=$(KUBECONFIG=/tmp/lke-kubeconfig kubectl get secret "$secret_name" -n "$secret_namespace" \
                            -o go-template='{{index .data "token"}}' 2> /dev/null || true)
                          if [ -n "$token_b64" ]; then
                            printf '%s' "$token_b64"
                            return 0
                          fi
                          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                            echo "Timed out waiting for token data in secret $secret_namespace/$secret_name" >&2
                            exit 1
                          fi
                          echo "  token data missing from secret $secret_namespace/$secret_name, retrying in $RETRY_INTERVALs..." >&2
                          sleep "$RETRY_INTERVAL"
                          attempt=$((attempt + 1))
                        done
                      }

                      echo "Waiting for kubeconfig secret: $SOURCE_SECRET_NAME"
                      wait_for_secret "$SOURCE_SECRET_NAME" argocd

                      KUBECONFIG_B64=$(wait_for_kubeconfig_data "$SOURCE_SECRET_NAME")

                      printf '%s' "$KUBECONFIG_B64" | base64 -d > /tmp/lke-kubeconfig

                      echo "Waiting for child cluster API readiness"
                      wait_for_cluster_api

                      echo "Waiting for Headlamp service account in target cluster"
                      wait_for_service_account "$HEADLAMP_SERVICE_ACCOUNT" "$HEADLAMP_NAMESPACE"

                      echo "Ensuring Headlamp token secret exists in target cluster"
                      KUBECONFIG=/tmp/lke-kubeconfig kubectl apply -f - <<EOF
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: $HEADLAMP_TOKEN_SECRET
                        namespace: $HEADLAMP_NAMESPACE
                        annotations:
                          kubernetes.io/service-account.name: $HEADLAMP_SERVICE_ACCOUNT
                      type: kubernetes.io/service-account-token
                      EOF

                      echo "Waiting for token data to be populated"
                      TOKEN_B64=$(wait_for_token "$HEADLAMP_TOKEN_SECRET" "$HEADLAMP_NAMESPACE")
                      HEADLAMP_TOKEN=$(printf '%s' "$TOKEN_B64" | base64 -d)

                      kubectl apply -f - <<EOF
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: $PUBLISHED_SECRET_NAME
                        namespace: $PLATFORM_CLUSTER_NAMESPACE
                        labels:
                          platform-cluster: $PLATFORM_CLUSTER_NAME
                          component: headlamp
                      type: Opaque
                      stringData:
                        token: "$HEADLAMP_TOKEN"
                        clusterName: "$CLUSTER_NAME"
                        namespace: "$HEADLAMP_NAMESPACE"
                        serviceAccountName: "$HEADLAMP_SERVICE_ACCOUNT"
                        sourceSecretName: "$HEADLAMP_TOKEN_SECRET"
                      EOF

                      echo "Published Headlamp token to $PLATFORM_CLUSTER_NAMESPACE/$PUBLISHED_SECRET_NAME"
                      rm -f /tmp/lke-kubeconfig
