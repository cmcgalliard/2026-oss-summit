apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platformcluster-kro-controller
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  - apiGroups: ["api.platform.example.com"]
    resources: ["platformclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["api.platform.example.com"]
    resources: ["platformclusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["api.platform.example.com"]
    resources: ["platformclusters/finalizers"]
    verbs: ["update"]
  - apiGroups: ["lke.linode.upbound.io"]
    resources: ["clusters", "nodepools"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
