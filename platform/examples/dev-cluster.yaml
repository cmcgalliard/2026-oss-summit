apiVersion: api.platform.example.com/v1
kind: PlatformCluster
metadata:
  name: demo-dev-cluster
  namespace: default
  labels:
    environment: dev
    team: platform-team
    purpose: development
spec:
  clusterSpec:
    clusterName: demo-dev-cluster
    region: us-east
    kubernetesVersion: "1.35"
    nodePool:
      count: 3
      type: g6-standard-4
    labels:
      environment: dev
      team: platform-team
    controlPlaneAcl:
      enabled: false
  components:
    o11yStack:
      enabled: true
      loki: true
      tempo: true
      grafana: true
      alloy: true
    harbor:
      enabled: false
    headlamp:
      enabled: true
