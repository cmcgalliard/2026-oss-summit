apiVersion: api.platform.example.com/v1
kind: PlatformCluster
metadata:
  name: demo-staging-cluster
  namespace: default
  labels:
    environment: staging
    team: platform-team
    purpose: staging-validation
spec:
  clusterSpec:
    clusterName: demo-staging-cluster
    region: us-ord
    kubernetesVersion: "1.35"
    nodePool:
      count: 3
      type: g6-standard-6
    labels:
      environment: staging
      team: platform-team
  components:
    o11yStack:
      enabled: true
      loki: true
      tempo: true
      grafana: true
      alloy: true
    harbor:
      enabled: false
    headlamp:
      enabled: true
