# Loki Helm Values — LKE Platform Engineering Demo
# Chart: grafana/loki v6.55.0 (Loki 3.6.7)
# Repo: https://grafana.github.io/helm-charts
# Namespace: o11y
# Mode: SingleBinary (monolithic — suitable for demo)
#
# Managed as ArgoCD Application — see platform/apps/o11y.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  pattern_ingester:
    enabled: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 744h # 31 days
    max_query_series: 1000

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: linode-block-storage-retain
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

gateway:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP

monitoring:
  lokiCanary:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false

# Zero out microservices-mode replicas (SingleBinary mode only)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
