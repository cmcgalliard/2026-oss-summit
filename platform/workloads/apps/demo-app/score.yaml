apiVersion: score.dev/v1b1
metadata:
  name: nginx
containers:
  webapp:
    image: nginxinc/nginx-unprivileged:alpine-slim
service:
  ports:
    tcp:
      port: 80
      targetPort: 80
resources:
  dns:
    type: dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      path: /
      port: 80

