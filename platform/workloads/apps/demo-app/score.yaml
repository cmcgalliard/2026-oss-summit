apiVersion: score.dev/v1b1
metadata:
  name: nginx
containers:
  webapp:
    image: scorespec/sample-score-app:latest
service:
  ports:
    tcp:
      port: 80
      targetPort: 8080
resources:
  dns:
    type: dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      path: /
      port: 80
