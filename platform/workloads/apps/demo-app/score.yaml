apiVersion: score.dev/v1b1
metadata:
  name: demo-app

containers:
  demo-app:
    image: nginx:1.27
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /
        port: 80
    readinessProbe:
      httpGet:
        path: /
        port: 80

service:
  ports:
    http:
      port: 80
      targetPort: 80
