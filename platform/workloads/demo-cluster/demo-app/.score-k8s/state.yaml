workloads:
  demo-app:
    spec:
      apiVersion: score.dev/v1b1
      containers:
        demo-app:
          image: nginx:1.27
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
