# ArgoCD Helm Values — LKE Platform Engineering Demo
# Chart: argo/argo-cd v9.4.17
# Namespace: argocd
#
# Bootstrap Install:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm repo update
#   kubectl create namespace argocd
#   helm install argocd argo/argo-cd \
#     --namespace argocd \
#     --version 9.4.17 \
#     --values platform/bootstrap/argocd/values.yaml
#
# After install, apply all ArgoCD Applications:
#   kubectl apply -f platform/apps/

global:
  domain: "" # Optional: set to your LoadBalancer IP or hostname

configs:
  secret:
    # admin password: "admin" (demo only — change for production)
    # To regenerate: htpasswd -nbBC 10 "" 'newpassword' | tr -d ':\n' | sed 's/$2y/$2a/'
    argocdServerAdminPassword: "0SSSUMMIT2026"
    argocdServerAdminPasswordMtime: "2026-04-01T02:00:58Z"

  params:
    # Disable TLS for demo (enable in production)
    server.insecure: "true"
    # Allow ArgoCD to manage apps in any namespace
    application.namespaces: "*"

  # Configure ArgoCD to use the current git repo
  repositories: {}

server:
  service:
    type: LoadBalancer

  extraArgs:
    - --insecure

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

notifications:
  enabled: false

dex:
  enabled: false
